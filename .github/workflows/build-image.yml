name: Build Image

# Builds without pushing: with no `image` input the shared workflow skips the
# registry login. Pushing is release.yml's job.

on:
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
    uses: jcwearn/workflows/.github/workflows/docker-build.yaml@e1cc176411dffc046fdbdef9d3262333ea1b0e64 # v1.9.1

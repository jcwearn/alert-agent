name: Build Image

# Builds without pushing: with no `image` input the shared workflow skips the
# registry login. Pushing is release.yml's job.

on:
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: read
    uses: jcwearn/workflows/.github/workflows/docker-build.yaml@a4078f8872df8f51a014632feadee3b7696860a1 # v1.9.0

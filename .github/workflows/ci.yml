name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    permissions:
      contents: read
    # Renovate keeps this digest current and the comment naming its exact
    # release. Never `# v1`: it fails zizmor's ref-version-mismatch audit.
    uses: jcwearn/workflows/.github/workflows/go-ci.yaml@e1cc176411dffc046fdbdef9d3262333ea1b0e64 # v1.9.1
    with:
      # The store tests start a real Postgres through embedded-postgres, which
      # downloads its binaries from Maven Central into this directory on every
      # cold run. One failed fetch failed a whole run (alert-agent#6); cached,
      # the download happens once per embedded-postgres version.
      cache-paths: ~/.embedded-postgres-go
      cache-key: embedded-postgres
